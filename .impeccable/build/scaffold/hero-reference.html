<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: discover.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1487px">
  <div class="r-header region chrome" data-region="header"><!-- Wordmark, primary navigation, and Blux login action --></div>
  <div class="r-hero region text" data-region="hero"><!-- Editorial display title, supporting copy, and product principles --><p style="font-size:var(--r-hero-font);font-family:var(--r-hero-family),sans-serif;font-weight:var(--r-hero-weight);line-height:1.05;margin:0">hero</p></div>
  <div class="r-directory-controls region control" data-region="directory-controls"><!-- Launch status filters and search: rebuild the control's chrome from the crop (comp-spec.mjs --crop directory-controls); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-launch-list region control" data-region="launch-list"><!-- Dense launch records with progress, rules, eligibility, and gated actions: rebuild the control's chrome from the crop (comp-spec.mjs --crop launch-list); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
